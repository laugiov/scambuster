<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 140" width="700" height="140">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0a2a0a" stroke-width="0.4"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bg" cx="30%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#061a06"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </radialGradient>
  </defs>

  <rect width="700" height="140" fill="url(#bg)"/>
  <rect width="700" height="140" fill="url(#grid)"/>

  <!-- Spider web (small, left) -->
  <g transform="translate(70,70)" filter="url(#glow)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#00ff41" stroke-width="0.9" opacity="0.5"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#00ff41" stroke-width="0.8" opacity="0.38"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#00ff41" stroke-width="0.7" opacity="0.25"/>
    <line x1="0" y1="-56" x2="0"   y2="56"  stroke="#00ff41" stroke-width="0.6" opacity="0.4"/>
    <line x1="-56" y1="0" x2="56"  y2="0"   stroke="#00ff41" stroke-width="0.6" opacity="0.4"/>
    <line x1="-40" y1="-40" x2="40" y2="40" stroke="#00ff41" stroke-width="0.5" opacity="0.3"/>
    <line x1="40"  y1="-40" x2="-40" y2="40" stroke="#00ff41" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Spider -->
  <g transform="translate(70,70)" filter="url(#strongGlow)">
    <ellipse cx="0" cy="-5"  rx="8"  ry="6"  fill="#00ff41"/>
    <ellipse cx="0" cy="7"   rx="11" ry="9"  fill="#00ff41"/>
    <circle  cx="0" cy="-13" r="5"           fill="#00ff41"/>
    <circle cx="-2" cy="-14" r="1.5" fill="#ff0000" filter="url(#redGlow)"/>
    <circle cx=" 2" cy="-14" r="1.5" fill="#ff0000" filter="url(#redGlow)"/>
    <path d="M-3,3 L0,8 L3,3 L0,5 Z" fill="#ff2222"/>
    <!-- Legs L -->
    <path d="M-8,-4  C-18,-8  -32,-18 -44,-14" fill="none" stroke="#00ff41" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-8, 0  C-18,-2  -34, -4 -46,3"   fill="none" stroke="#00ff41" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-8, 5  C-18, 6  -32,10 -42,20"   fill="none" stroke="#00ff41" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-8, 10 C-18,14  -30,20 -38,32"   fill="none" stroke="#00ff41" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Legs R -->
    <path d="M8,-4   C18,-8   32,-18  44,-14" fill="none" stroke="#00ff41" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M8, 0   C18,-2   34, -4  46,3"   fill="none" stroke="#00ff41" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M8, 5   C18, 6   32,10   42,20"  fill="none" stroke="#00ff41" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M8, 10  C18,14   30,20   38,32"  fill="none" stroke="#00ff41" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Hook caught -->
  <g transform="translate(82,38)" filter="url(#redGlow)">
    <path d="M0,0 L0,24 Q0,36 10,36 Q20,36 20,27 Q20,19 13,19"
          fill="none" stroke="#ff3333" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M13,19 L8,26" fill="none" stroke="#ff3333" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-14" stroke="#ff3333" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6"/>
    <line x1="-4" y1="-3" x2="4" y2="5"  stroke="#ff1111" stroke-width="2" stroke-linecap="round"/>
    <line x1=" 4" y1="-3" x2="-4" y2="5" stroke="#ff1111" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Silk threads -->
  <g opacity="0.4" filter="url(#glow)">
    <line x1="82" y1="38" x2="73" y2="35" stroke="#00ff41" stroke-width="0.9"/>
    <line x1="95" y1="55" x2="100" y2="44" stroke="#00ff41" stroke-width="0.9"/>
  </g>

  <!-- Vertical separator -->
  <line x1="135" y1="20" x2="135" y2="120" stroke="#00ff41" stroke-width="1.2" opacity="0.3"/>

  <!-- WORDMARK horizontal -->
  <text x="162" y="62"
        font-family="'Courier New', monospace"
        font-size="62" font-weight="900" letter-spacing="-1"
        fill="#00ff41" text-anchor="start"
        filter="url(#strongGlow)">SCAM</text>

  <text x="162" y="118"
        font-family="'Courier New', monospace"
        font-size="62" font-weight="900" letter-spacing="-1"
        fill="#ffffff" text-anchor="start"
        filter="url(#strongGlow)">BUSTER</text>

  <!-- Thin rule between the two words -->
  <line x1="162" y1="74" x2="540" y2="74" stroke="#00ff41" stroke-width="1.5" opacity="0.45" filter="url(#glow)"/>

  <!-- Tagline right-aligned -->
  <text x="695" y="95"
        font-family="'Courier New', monospace"
        font-size="10" fill="#008820" text-anchor="end"
        letter-spacing="4">WE HUNT THE HUNTERS</text>

  <!-- Cursor blink -->
  <rect x="541" y="98" width="9" height="18" fill="#ffffff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
