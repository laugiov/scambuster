<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 140" width="392" height="140">
  <!-- ScamBuster horizontal lockup. Transparent background, brand colours. -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Spider web (left) -->
  <g transform="translate(70,70)" filter="url(#glow)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#3df08a" stroke-width="0.9" opacity="0.5"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#3df08a" stroke-width="0.8" opacity="0.38"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#3df08a" stroke-width="0.7" opacity="0.25"/>
    <line x1="0" y1="-56" x2="0"   y2="56"  stroke="#3df08a" stroke-width="0.6" opacity="0.4"/>
    <line x1="-56" y1="0" x2="56"  y2="0"   stroke="#3df08a" stroke-width="0.6" opacity="0.4"/>
    <line x1="-40" y1="-40" x2="40" y2="40" stroke="#3df08a" stroke-width="0.5" opacity="0.3"/>
    <line x1="40"  y1="-40" x2="-40" y2="40" stroke="#3df08a" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Spider -->
  <g transform="translate(70,70)" filter="url(#strongGlow)">
    <ellipse cx="0" cy="-5"  rx="8"  ry="6"  fill="#3df08a"/>
    <ellipse cx="0" cy="7"   rx="11" ry="9"  fill="#3df08a"/>
    <circle  cx="0" cy="-13" r="5"           fill="#3df08a"/>
    <circle cx="-2" cy="-14" r="1.5" fill="#ff5563" filter="url(#redGlow)"/>
    <circle cx=" 2" cy="-14" r="1.5" fill="#ff5563" filter="url(#redGlow)"/>
    <path d="M-3,3 L0,8 L3,3 L0,5 Z" fill="#ff5563"/>
    <!-- Legs L -->
    <path d="M-8,-4  C-18,-8  -32,-18 -44,-14" fill="none" stroke="#3df08a" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-8, 0  C-18,-2  -34, -4 -46,3"   fill="none" stroke="#3df08a" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-8, 5  C-18, 6  -32,10 -42,20"   fill="none" stroke="#3df08a" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-8, 10 C-18,14  -30,20 -38,32"   fill="none" stroke="#3df08a" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Legs R -->
    <path d="M8,-4   C18,-8   32,-18  44,-14" fill="none" stroke="#3df08a" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M8, 0   C18,-2   34, -4  46,3"   fill="none" stroke="#3df08a" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M8, 5   C18, 6   32,10   42,20"  fill="none" stroke="#3df08a" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M8, 10  C18,14   30,20   38,32"  fill="none" stroke="#3df08a" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Hook caught -->
  <g transform="translate(82,38)" filter="url(#redGlow)">
    <path d="M0,0 L0,24 Q0,36 10,36 Q20,36 20,27 Q20,19 13,19"
          fill="none" stroke="#ff5563" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M13,19 L8,26" fill="none" stroke="#ff5563" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-14" stroke="#ff5563" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6"/>
    <line x1="-4" y1="-3" x2="4" y2="5"  stroke="#ff5563" stroke-width="2" stroke-linecap="round"/>
    <line x1=" 4" y1="-3" x2="-4" y2="5" stroke="#ff5563" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Silk threads -->
  <g opacity="0.4" filter="url(#glow)">
    <line x1="82" y1="38" x2="73" y2="35" stroke="#3df08a" stroke-width="0.9"/>
    <line x1="95" y1="55" x2="100" y2="44" stroke="#3df08a" stroke-width="0.9"/>
  </g>

  <!-- Vertical separator -->
  <line x1="135" y1="24" x2="135" y2="116" stroke="#2f7a4f" stroke-width="1.2" opacity="0.5"/>

  <!-- WORDMARK -->
  <text x="162" y="62"
        font-family="'JetBrains Mono','Courier New', monospace"
        font-size="62" font-weight="700" letter-spacing="-1"
        fill="#8dffbe" text-anchor="start"
        filter="url(#strongGlow)">SCAM</text>

  <text x="162" y="118"
        font-family="'JetBrains Mono','Courier New', monospace"
        font-size="62" font-weight="700" letter-spacing="-1"
        fill="#ffffff" text-anchor="start">BUSTER</text>

  <!-- Thin rule between the two words -->
  <line x1="162" y1="74" x2="382" y2="74" stroke="#2f7a4f" stroke-width="1.5" opacity="0.5"/>
</svg>
