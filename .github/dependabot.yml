version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/backend-symfony"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "php"
    # Only security updates and major/minor bumps, skip patch-only
    allow:
      - dependency-type: "direct"

  - package-ecosystem: "npm"
    directory: "/frontend-react"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "javascript"
    allow:
      - dependency-type: "direct"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "ci"

  # Base image updates (PHP, Node, nginx, ...). Without this, the pinned
  # `FROM php:8.3.x` in the Dockerfiles below never gets bumped and the
  # runtime silently falls behind its security patches.
  - package-ecosystem: "docker"
    directories:
      - "/infra/docker/backend"
      - "/infra/docker/demo"
      - "/infra/docker/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
      - "security"
