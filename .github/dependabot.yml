version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/backend-symfony"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "php"
    # Only security updates and major/minor bumps, skip patch-only
    allow:
      - dependency-type: "direct"

  - package-ecosystem: "npm"
    directory: "/frontend-react"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "javascript"
    allow:
      - dependency-type: "direct"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "ci"
