# ScamBuster GitHub Labels
# Create via: gh label create "name" --color "color" --description "desc"
# Or use a label sync tool (e.g., github-label-sync)

- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "feature"
  color: "0075ca"
  description: "New feature or request"
- name: "docs"
  color: "0075ca"
  description: "Documentation improvements"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention needed"
- name: "security"
  color: "e4e669"
  description: "Security-related"
- name: "pipeline"
  color: "f9d0c4"
  description: "LLM pipeline related"
- name: "bandit"
  color: "c2e0c6"
  description: "Adaptive bandit related"
- name: "ioc"
  color: "fef2c0"
  description: "IOC extraction related"
- name: "stix"
  color: "d4c5f9"
