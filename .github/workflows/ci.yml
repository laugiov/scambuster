name: CI

on:
  push:
    branches: [main, demo]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A superseded run does not stop on its own: pushing twice to a PR leaves two
# runs resolving the same dependency tree against codeload.github.com at once,
# which doubles exactly the burst this workflow is trying not to make. Cancel the
# old one. Not on `main` or `demo` — there, every commit's result is a record
# worth having, and pushes are rare enough that they do not stack.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ── Why this workflow looks the way it does ──────────────────────────────────
#
# Everything below is about one host: codeload.github.com. Composer resolves each
# package as a dist archive from api.github.com, which redirects the actual zip
# there. Composer does not carry the Authorization header across a redirect to a
# different host — correctly — so codeload sees an anonymous request under a
# per-IP limit that no token lifts.
#
# What was established, run by run, rather than assumed:
#
#   747 (main)  HTTP 504 from api.github.com interleaved with 429 from codeload.
#               Merged past on PR #62 as "a transient 504". It was not transient:
#               it reproduced on main and on three runs of PR #63.
#   748         The job token removed every 504. The 429s from codeload remained,
#               so authentication fixes half of this and cannot fix the other.
#   750         The runner failed to download a 40 KB *first-party action tarball*
#               (actions/download-artifact) from codeload: 429, 429, then 502,
#               before a single workflow step had run.
#
# That last one matters more than the rest, and it corrects an earlier reading
# written into this file: the story was "our own concurrency is rate-limiting
# us". A 429 on an action tarball is not something this workflow's Composer
# volume can cause — the runner fetches actions before our steps exist. codeload
# is throttling or degraded for these runners independently of what we ask of it.
#
# So the changes here are made on their own merits — fewer requests is right
# whatever the cause — and NOT on a claim that they make codeload reliable:
#
#   - `build-backend-image` builds the image ONCE per run and ships it as an
#     artifact. Four concurrent dependency resolutions become one.
#   - That build is layer-cached (keyed on composer.lock + the Dockerfile), so in
#     the steady state the dependency downloads do not happen at all. This is the
#     only caching that removes them; a host-side Composer cache cannot reach
#     inside a build.
#   - The token, COMPOSER_MAX_PARALLEL_HTTP and a jittered retry remain as depth.
#   - A concurrency group cancels superseded PR runs.
#
# What none of it fixes: when codeload refuses to serve action tarballs, jobs die
# before reaching any of this. That is outside the repository's control and must
# be named in the gate report as such — with evidence, per the gate-trust rule in
# docs/factory/README.md. "Infrastructure" is a finding to be shown, never an
# assumption to wave a red run through on.
env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
  COMPOSER_MAX_PARALLEL_HTTP: '6'

jobs:
  # Build the backend image ONCE per run, and ship it to the other jobs.
  #
  # This job is the fix for the 429s, and it is structural rather than a tuning
  # knob. Composer pulls ~200 dist archives from codeload.github.com, which
  # applies a per-IP abuse limit that no token lifts (see the note above). Four
  # jobs each running `docker compose up --build` produced four of those bursts
  # from one runner IP in the same second. That is what took `main` down at
  # 3abdb7c, and runs 748 and 749 of this PR with it.
  #
  # Fewer parallel connections and a jittered backoff improved the odds. They did
  # not remove the cause: N concurrent full dependency resolutions. One build per
  # run does, and it is the only change here that cannot be defeated by GitHub
  # tightening the limit further.
  #
  # The image travels as an artifact instead of being rebuilt. Measured on the
  # first green run (754) against the last green run of main (31988125536):
  #
  #   image build            2m36s, once, on the critical path
  #   artifact upload        ~4s (281 MB)
  #   download + docker load 12s + 19s per consumer
  #   whole run              12m13s, against 10m04s before
  #
  # So it costs about **two minutes of wall clock**, not nothing. An earlier
  # version of this comment claimed the run got cheaper; the measurement says
  # otherwise and the claim is withdrawn. What the two minutes buy is four
  # concurrent dependency resolutions becoming one, and every job testing the
  # *same* image rather than a second build of the same Dockerfile.
  build-backend-image:
    name: Build backend image (once per run)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create environment files
        run: bash .github/scripts/create-ci-env.sh

      # Keyed on the lock file and the Dockerfile — the two inputs that decide
      # what `composer install` downloads. On a hit, BuildKit reuses the layer
      # and the ~200 archive requests to codeload.github.com are never made at
      # all. That is the only form of caching that removes them: a host-side
      # Composer cache cannot reach inside a build, which is why the earlier
      # per-job `actions/cache` steps have been dropped in favour of this one.
      - name: Cache the image build layers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/.buildx-cache
          key: buildx-backend-${{ hashFiles('backend-symfony/composer.lock', 'infra/docker/backend/Dockerfile') }}
          restore-keys: buildx-backend-

      - name: Build the dev/test image
        run: |
          # A builder with the docker-container driver: the default driver
          # cannot export a layer cache, so --cache-to would be silently useless.
          docker buildx create --name ci-builder --driver docker-container --use 2>/dev/null \
            || docker buildx use ci-builder

          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --build-arg COMPOSER_AUTH_JSON="$COMPOSER_AUTH" \
            -f infra/docker/backend/Dockerfile \
            -t scambuster-backend:ci \
            --load .

          # buildx cannot write the cache in place; without this swap the entry
          # grows without bound across runs.
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Export the image
        run: |
          docker save scambuster-backend:ci | gzip -1 > /tmp/backend-image.tar.gz
          ls -lh /tmp/backend-image.tar.gz

      - name: Upload the image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-image
          path: /tmp/backend-image.tar.gz
          retention-days: 1
          # Already gzipped above; letting the action zip it again costs a minute
          # and saves nothing.
          compression-level: 0

  static-analysis:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    needs: [build-backend-image]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create environment files
        run: bash .github/scripts/create-ci-env.sh


      - name: Load the backend image built once for this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-image
          path: /tmp

      - name: Import it into the daemon
        run: docker load < /tmp/backend-image.tar.gz

      - name: Start containers
        run: docker compose up -d postgres redis backend-dev

      - name: Wait for services
        run: make wait-healthy

      - name: Install dependencies
        run: bash .github/scripts/composer-install.sh backend-dev

      - name: Fix permissions
        run: docker compose exec --user root backend-dev sh -c "chown -R 10001:10001 /app/vendor /app/var"

      - name: Run PHPStan
        run: docker compose exec backend-dev vendor/bin/phpstan analyse src --memory-limit=1G

      - name: Vault resurrection guard
        run: bash .github/scripts/check-no-vault-resurrection.sh

  code-style:
    name: Code Style (PHP-CS-Fixer)
    runs-on: ubuntu-latest
    needs: [build-backend-image]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create environment files
        run: bash .github/scripts/create-ci-env.sh


      - name: Load the backend image built once for this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-image
          path: /tmp

      - name: Import it into the daemon
        run: docker load < /tmp/backend-image.tar.gz

      - name: Start containers
        run: docker compose up -d postgres redis backend-dev

      - name: Wait for services
        run: make wait-healthy

      - name: Install dependencies
        run: bash .github/scripts/composer-install.sh backend-dev

      - name: Fix permissions
        run: docker compose exec --user root backend-dev sh -c "chown -R 10001:10001 /app/vendor /app/var"

      - name: Run PHP-CS-Fixer (dry-run)
        run: docker compose exec backend-dev vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no

  backend-tests:
    name: Backend Tests (Unit + Integration)
    runs-on: ubuntu-latest
    needs: [build-backend-image]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: the patch coverage gate at the end of this job diffs
          # the PR against its base, which the default depth-1 checkout cannot do.
          fetch-depth: 0

      - name: Create environment files
        run: bash .github/scripts/create-ci-env.sh


      - name: Load the backend image built once for this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-image
          path: /tmp

      - name: Import it into the daemon
        run: docker load < /tmp/backend-image.tar.gz

      - name: Start services
        run: docker compose up -d postgres redis backend-test

      - name: Wait for healthy services
        run: |
          echo "Waiting for postgres..."
          for i in $(seq 1 30); do docker compose exec postgres pg_isready -U postgres && break || sleep 2; done
          echo "Waiting for backend-test..."
          for i in $(seq 1 30); do docker compose exec backend-test php -v > /dev/null 2>&1 && break || sleep 2; done

      # The `2>/dev/null` that used to be on the install line is gone on purpose:
      # it discarded exactly the "Failed to download ... (HTTP/2 429)" lines that
      # explain why this step fails, which is part of why five red runs on PR #62
      # were read as one transient 504.
      - name: Install dependencies
        run: |
          bash .github/scripts/composer-install.sh backend-test
          docker compose exec --user root backend-test sh -c "chown -R 10001:10001 /app/vendor /app/var 2>/dev/null || true"

      - name: Setup database
        run: |
          docker compose exec backend-test php bin/console doctrine:database:create --if-not-exists --env=test
          docker compose exec backend-test php bin/console doctrine:migrations:migrate --no-interaction --env=test
          docker compose exec backend-test php bin/console doctrine:fixtures:load --no-interaction --env=test

      - name: Run tests with coverage (unit + integration)
        # `-d memory_limit=512M` — PHPUnit code-coverage report generation peaks
        # around 200-300 MB once the suite grows past ~3500 tests. Default 128 MB
        # OOMed at coverage-report time (tests themselves had passed). Same
        # pattern as PHPStan above (which uses --memory-limit=1G).
        #
        # `functional` is deliberately absent from the suite list: phpunit.ci.xml
        # does not define it (the CI variant drops SymfonyExtension, which
        # conflicts with the Docker volume mounts WebTestCase needs). Naming it
        # anyway would be silently ignored — PHPUnit does not fail on an unknown
        # suite name — and the job would report green while ~855 controller tests
        # never ran. Run those locally with `make test`.
        run: |
          docker compose exec backend-test vendor/bin/phpunit \
            -d memory_limit=512M \
            --configuration phpunit.ci.xml \
            --testsuite unit,integration \
            --exclude-group compiler-pass \
            --coverage-clover /tmp/coverage.xml \
            --testdox --colors=never

      - name: Run CompilerPass tests (isolated)
        run: |
          docker compose exec backend-test vendor/bin/phpunit \
            --configuration phpunit.ci.xml \
            --group compiler-pass \
            --colors=never

      - name: Extract unit+integration coverage
        if: always()
        run: |
          docker compose exec backend-test cat /tmp/coverage.xml > coverage-unit-integration.xml 2>/dev/null || true
          wc -c coverage-unit-integration.xml

      - name: Generate JWT keys for E2E
        if: always()
        run: |
          mkdir -p backend-symfony/config/jwt
          openssl genpkey -algorithm RSA \
            -out backend-symfony/config/jwt/private.pem \
            -aes-256-cbc -pass pass:scambuster-jwt-dev-passphrase \
            -pkeyopt rsa_keygen_bits:2048 2>/dev/null
          openssl rsa \
            -in backend-symfony/config/jwt/private.pem \
            -pubout -out backend-symfony/config/jwt/public.pem \
            -passin pass:scambuster-jwt-dev-passphrase 2>/dev/null
          chmod 644 backend-symfony/config/jwt/*.pem
          echo "JWT keys generated for E2E"

      - name: Start E2E container
        if: always()
        run: |
          docker compose up -d backend-e2e
          for i in $(seq 1 30); do docker compose exec backend-e2e php -v > /dev/null 2>&1 && break || sleep 2; done

      - name: Setup E2E database
        if: always()
        run: |
          bash .github/scripts/composer-install.sh backend-e2e
          docker compose exec --user root backend-e2e sh -c "chown -R 10001:10001 /app/vendor /app/var 2>/dev/null || true"
          docker compose exec backend-e2e php bin/console doctrine:database:create --if-not-exists --env=e2e
          docker compose exec backend-e2e php bin/console doctrine:migrations:migrate --no-interaction --env=e2e
          docker compose exec backend-e2e php bin/console doctrine:fixtures:load --no-interaction --env=e2e

      - name: Run E2E tests with coverage
        if: always()
        # Same `-d memory_limit=512M` as the unit/integration job — coverage
        # report generation OOMs at the default 128 MB on a 308-test suite.
        run: |
          docker compose exec backend-e2e vendor/bin/phpunit \
            -d memory_limit=512M \
            --testsuite endtoend \
            --exclude-group ci-skip \
            --coverage-clover /tmp/coverage-e2e.xml \
            --colors=never

      - name: Extract E2E coverage
        if: always()
        run: |
          docker compose exec backend-e2e cat /tmp/coverage-e2e.xml > coverage-e2e.xml 2>/dev/null || true
          wc -c coverage-e2e.xml

      - name: Upload to Codecov (unit + integration + e2e merged)
        if: always()
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: ./coverage-unit-integration.xml,./coverage-e2e.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # Factory gate: are the lines this PR changed actually covered?
      #
      # Runs here rather than in factory-gates.yml because the clover reports
      # already exist in this job — computing it elsewhere would mean running the
      # whole suite with coverage a second time. Codecov keeps the project-level
      # "not below base" comparison (target: auto); this answers the narrower and
      # more actionable question of whether the PR adds untested code.
      #
      # The threshold has NOT been calibrated against this repository's history —
      # it cannot be, from a checkout alone. Adjust it here after the first few
      # PRs rather than letting a wrong number get worked around.
      - name: Patch coverage gate
        if: github.event_name == 'pull_request'
        env:
          FACTORY_PATCH_COVERAGE_MIN: '80'
        run: |
          python3 scripts/factory/patch-coverage.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --min "$FACTORY_PATCH_COVERAGE_MIN" \
            coverage-unit-integration.xml coverage-e2e.xml

      # Factory gate: mutation testing on the changed files.
      #
      # Coverage says a line ran; mutation says a test would have noticed if the
      # line were wrong. Infection is already configured here (infection.json5,
      # min MSI 70 / covered 80) but has only ever been a manual `make mutation`.
      #
      # NOT blocking: it has never run in CI on this codebase, so its duration
      # and survivor rate are unknown, and a gate that fails unpredictably on its
      # first day gets switched off. Read the MSI in the gate report for a few
      # PRs, then drop continue-on-error and set the threshold deliberately.
      # The changed-file list is computed HERE, on the runner, and passed to
      # Infection with --filter. Its --git-diff-base option cannot be used: the
      # container mounts ./backend-symfony as /app, and .git lives at the repo
      # root, so git inside the container has no repository to diff against. That
      # would have failed on every run and been swallowed by continue-on-error —
      # a gate reporting nothing while looking like it ran.
      #
      # Infection re-runs the suite to collect its own coverage: the clover report
      # produced above is not the coverage-xml + junit pair it can reuse. Hence
      # the timeout, and hence restricting it to the files the PR touched.
      - name: Mutation testing on changed files (reported, not blocking)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          CHANGED=$(git diff --name-only --diff-filter=AM \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            -- 'backend-symfony/src/*.php' 'backend-symfony/src/**/*.php' \
            | sed 's|^backend-symfony/||' | paste -sd, -)

          if [ -z "$CHANGED" ]; then
            echo "No PHP source changed; mutation testing not applicable."
            exit 0
          fi

          echo "Mutating: $CHANGED"
          docker compose exec -T backend-test vendor/bin/infection \
            --threads=4 \
            --filter="$CHANGED" \
            --min-msi=0 --min-covered-msi=0 \
            --no-progress --no-interaction \
            || echo "::warning::Infection did not complete. Record this as 'not run' in the gate report, never as 'passed'."

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: [build-backend-image]
    # The workflow's top-level permissions are 'contents: read'. The Gitleaks
    # action additionally needs to list a PR's commits via
    # GET /repos/{owner}/{repo}/pulls/{n}/commits, which requires
    # 'pull-requests: read'. Without it, the API returns 403 with
    # 'x-accepted-github-permissions: pull_requests=read' and the job dies.
    # Granted at the job level so other jobs keep the tighter default.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Create environment files
        run: bash .github/scripts/create-ci-env.sh


      - name: Load the backend image built once for this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-image
          path: /tmp

      - name: Import it into the daemon
        run: docker load < /tmp/backend-image.tar.gz
      - name: Composer audit (PHP SCA)
        run: |
          docker compose up -d backend-dev
          bash .github/scripts/composer-install.sh backend-dev
          # Blocking on NEW vulnerabilities, ignoring known/accepted CVEs.
          # Previously-ignored entries were cleared (Symfony 7.4 + PHPUnit 10.5.63
          # upgrades fixed them). Keep this set in sync with scripts/preflight-check.sh
          # and backend-symfony/composer.json audit.ignored.
          AUDIT_JSON=$(docker compose exec backend-dev composer audit --format=json 2>/dev/null || true)
          echo "$AUDIT_JSON" | python3 -c "
          import sys, json
          raw = sys.stdin.read().strip()
          if not raw:
              print('Composer audit returned no output (no advisories found)')
              sys.exit(0)
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              print('::warning::Composer audit returned non-JSON output:')
              print(raw[:500])
              sys.exit(0)
          ignored = set()
          unignored = []
          # composer audit serializes 'advisories' as {} when populated, [] when empty.
          advisories_field = data.get('advisories', {})
          if isinstance(advisories_field, dict):
              for pkg, advisories in advisories_field.items():
                  for adv in advisories:
                      if adv.get('advisoryId') not in ignored:
                          unignored.append(f\"{pkg}: {adv.get('title', 'unknown')} ({adv.get('advisoryId')})\")
          if unignored:
              print('::error::New vulnerabilities found:')
              for u in unignored: print(f'  - {u}')
              sys.exit(1)
          else:
              print(f'Composer audit OK ({len(ignored)} known CVEs ignored)')
          "

      - name: Gitleaks (secret detection)
        # Run the gitleaks CLI directly (MIT, free) instead of the
        # gitleaks-action wrapper, which now requires a paid GITLEAKS_LICENSE
        # secret. Scans full git history (fetch-depth: 0 above) and honours the
        # repo's .gitleaks.toml. Exits non-zero on any finding.
        run: |
          GITLEAKS_VERSION=8.21.2
          mkdir -p "$HOME/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$HOME/bin" gitleaks
          "$HOME/bin/gitleaks" version
          "$HOME/bin/gitleaks" git . --redact --verbose --config .gitleaks.toml --exit-code 1

  frontend:
    name: Frontend (TypeScript, Lint, Tests, Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-react

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Production build
        run: npm run build

  container-security:
    name: Container Security (Trivy + SBOM)
    runs-on: ubuntu-latest
    needs: [build-backend-image, static-analysis]
    # Blocking gate. The Dockerfiles run `apt-get upgrade` so fixable base-image
    # CVEs are patched at build time; unfixable ones (perl-base, kernel headers,
    # ncurses — no upstream patch, not reachable from our PHP runtime) are skipped
    # via `ignore-unfixed` below. So a failure here means a *fixable* CRITICAL/HIGH
    # slipped in and must be addressed (usually a rebuild picks up the patch).
    # Scan BOTH images: the dev image (used by the stack + tests) and the
    # self-contained production image that actually gets deployed/published.
    strategy:
      fail-fast: false
      # One at a time. Each of these builds resolves the full dependency tree
      # against codeload.github.com, and three of them in parallel is the same
      # burst that made this workflow unreliable in the first place — just
      # displaced to a later stage of the run. This is a scanning job, not one
      # anybody waits on, so serialising it costs nothing that matters.
      max-parallel: 1
      matrix:
        include:
          - { name: dev, dockerfile: infra/docker/backend/Dockerfile }
          - { name: prod, dockerfile: infra/docker/backend/Dockerfile.prod }
          - { name: demo, dockerfile: infra/docker/demo/Dockerfile.backend }

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The dev image was already built once for this run. Reusing it removes a
      # fourth dependency resolution, and it makes the scan mean more: what gets
      # scanned is then byte-for-byte the image the tests actually ran against,
      # rather than a second build that merely used the same Dockerfile.
      - name: Reuse the prebuilt dev image
        if: matrix.name == 'dev'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-image
          path: /tmp

      - name: Import the prebuilt dev image
        if: matrix.name == 'dev'
        run: |
          docker load < /tmp/backend-image.tar.gz
          docker tag scambuster-backend:ci scambuster-dev:ci

      # COMPOSER_AUTH_JSON is consumed in each Dockerfile's build stage, which
      # the multi-stage COPY discards — the scanned image carries no token.
      - name: Build ${{ matrix.name }} image
        if: matrix.name != 'dev'
        run: |
          docker build -t scambuster-${{ matrix.name }}:ci \
            --build-arg COMPOSER_AUTH_JSON="$COMPOSER_AUTH" \
            -f ${{ matrix.dockerfile }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: 'scambuster-${{ matrix.name }}:ci'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          # ignore-unfixed: don't fail CI on CVEs that have no patch available
          # in any package upstream yet. Most of these are kernel/ncurses CVEs
          # in the Debian base of php:8.x that are red herrings inside a
          # container (containers share the host kernel) and that we cannot
          # fix without rebuilding the base image. We still want to be alerted
          # for fixable CVEs in our PHP/Composer dependency tree.
          ignore-unfixed: true
          trivyignores: '.trivyignore'

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: 'scambuster-${{ matrix.name }}:ci'
          format: 'cyclonedx'
          output: 'sbom-${{ matrix.name }}.cdx.json'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx-${{ matrix.name }}
          path: 'sbom-${{ matrix.name }}.cdx.json'
          retention-days: 30
