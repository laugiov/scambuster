name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create environment files
        run: |
          cat > .env << 'EOF'
          APP_ENV=test
          APP_DEBUG=0
          APP_SECRET=ci-test-app-secret
          DATABASE_URL=postgresql://postgres:postgres@postgres:5432/scambuster_test
          REDIS_URL=redis://redis:6379
          JWT_SECRET=ci-test-jwt-secret
          VAULT_ADDR=http://vault:8200
          VAULT_TOKEN=root
          VAULT_IMAP_PATH=secret/scambuster/imap/
          LOGIN_HASH_SALT=ci-test-salt
          LLM_API_KEY=sk-test-not-a-real-key
          LLM_PROVIDER=openai
          LLM_MODEL=gpt-4o-mini
          LLM_API_URL=https://api.openai.com/v1
          SCAMBUSTER_KILL_SWITCH=false
          PROMPT_INJECTION_ENABLED=false
          STIX_EXPORT_PATH=/tmp/stix-test
          SCORE_RISK_MIN=30
          CAMPAIGN_PROMOTION_PPV_THRESHOLD=0.85
          CAMPAIGN_PROMOTION_MIN_HITS=5
          CAMPAIGN_PROMOTION_MIN_LEAD_TIME_SEC=10800
          EOF
          sed -i 's/^[[:space:]]*//' .env
          cp .env .env.test

      - name: Start containers
        run: docker compose up -d --build postgres redis backend-dev

      - name: Wait for services
        run: make wait-healthy

      - name: Install dependencies
        run: docker compose exec --user root backend-dev composer install --no-interaction --no-progress

      - name: Fix permissions
        run: docker compose exec --user root backend-dev sh -c "chown -R 10001:10001 /app/vendor /app/var"

      - name: Run PHPStan
        run: docker compose exec backend-dev vendor/bin/phpstan analyse src --memory-limit=1G

  code-style:
    name: Code Style (PHP-CS-Fixer)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create environment files
        run: |
          cat > .env << 'EOF'
          APP_ENV=test
          APP_DEBUG=0
          APP_SECRET=ci-test-app-secret
          DATABASE_URL=postgresql://postgres:postgres@postgres:5432/scambuster_test
          REDIS_URL=redis://redis:6379
          JWT_SECRET=ci-test-jwt-secret
          VAULT_ADDR=http://vault:8200
          VAULT_TOKEN=root
          VAULT_IMAP_PATH=secret/scambuster/imap/
          LOGIN_HASH_SALT=ci-test-salt
          LLM_API_KEY=sk-test-not-a-real-key
          LLM_PROVIDER=openai
          LLM_MODEL=gpt-4o-mini
          LLM_API_URL=https://api.openai.com/v1
          SCAMBUSTER_KILL_SWITCH=false
          PROMPT_INJECTION_ENABLED=false
          STIX_EXPORT_PATH=/tmp/stix-test
          SCORE_RISK_MIN=30
          CAMPAIGN_PROMOTION_PPV_THRESHOLD=0.85
          CAMPAIGN_PROMOTION_MIN_HITS=5
          CAMPAIGN_PROMOTION_MIN_LEAD_TIME_SEC=10800
          EOF
          sed -i 's/^[[:space:]]*//' .env
          cp .env .env.test

      - name: Start containers
        run: docker compose up -d --build postgres redis backend-dev

      - name: Wait for services
        run: make wait-healthy

      - name: Install dependencies
        run: docker compose exec --user root backend-dev composer install --no-interaction --no-progress

      - name: Fix permissions
        run: docker compose exec --user root backend-dev sh -c "chown -R 10001:10001 /app/vendor /app/var"

      - name: Run PHP-CS-Fixer (dry-run)
        run: docker compose exec backend-dev vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no

  tests:
    name: Tests (PHPUnit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create environment files
        run: |
          cat > .env << 'EOF'
          APP_ENV=test
          APP_DEBUG=0
          APP_SECRET=ci-test-app-secret
          DATABASE_URL=postgresql://postgres:postgres@postgres:5432/scambuster_test
          REDIS_URL=redis://redis:6379
          JWT_SECRET=ci-test-jwt-secret
          VAULT_ADDR=http://vault:8200
          VAULT_TOKEN=root
          VAULT_IMAP_PATH=secret/scambuster/imap/
          LOGIN_HASH_SALT=ci-test-salt
          LLM_API_KEY=sk-test-not-a-real-key
          LLM_PROVIDER=openai
          LLM_MODEL=gpt-4o-mini
          LLM_API_URL=https://api.openai.com/v1
          SCAMBUSTER_KILL_SWITCH=false
          PROMPT_INJECTION_ENABLED=false
          STIX_EXPORT_PATH=/tmp/stix-test
          SCORE_RISK_MIN=30
          CAMPAIGN_PROMOTION_PPV_THRESHOLD=0.85
          CAMPAIGN_PROMOTION_MIN_HITS=5
          CAMPAIGN_PROMOTION_MIN_LEAD_TIME_SEC=10800
          REPLY_MIN_WORDS=50
          REPLY_MAX_WORDS=150
          REPLY_MAX_LINKS=1
          REPLY_HISTORY_LAST_N=5
          APP_API_BASE_URL=http://localhost:8081
          CONVERSATION_HISTORY_EXCLUDED_EMAILS=user@example.com
          LLM_VALIDATION_ENABLED=true
          LOCK_DSN=flock
          EOF
          sed -i 's/^[[:space:]]*//' .env
          cp .env .env.test

      - name: Fix host permissions
        run: chmod -R 777 backend-symfony/

      - name: Start services
        run: docker compose up -d --build postgres redis backend-test

      - name: Wait for services
        run: make wait-healthy

      - name: Install fresh dependencies (NO cache)
        run: docker compose exec --user root backend-test composer install --no-interaction --no-progress

      - name: Fix permissions
        run: docker compose exec --user root backend-test sh -c "chown -R 10001:10001 /app/vendor /app/var"

      - name: Create test database
        run: docker compose exec backend-test php bin/console doctrine:database:create --env=test --if-not-exists

      - name: Run migrations
        run: docker compose exec backend-test php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Load fixtures
        run: docker compose exec backend-test php bin/console doctrine:fixtures:load --env=test --no-interaction

      - name: Debug - check compiled cache for Kernel
        run: |
          echo "=== App\Kernel in compiled cache ==="
          docker compose exec backend-test sh -c "grep -rn 'App.Kernel' /app/var/cache/test/Container*/*.php 2>/dev/null | grep -v 'HttpKernel\|KernelEvent\|KernelBrowser\|KernelException' | head -10" || echo "No matches"
          echo "=== App\Kernel in classmap ==="
          docker compose exec backend-test sh -c "grep 'Kernel' /app/vendor/composer/autoload_classmap.php 2>/dev/null" || echo "Not in classmap"
          echo "=== include_once in container ==="
          docker compose exec backend-test sh -c "grep -c 'include_once' /app/var/cache/test/Container*/*.php 2>/dev/null" || echo "No container"

      - name: Clear compiled cache before PHPUnit
        run: docker compose exec backend-test rm -rf /app/var/cache/test/

      - name: Clear compiled cache before tests
        run: docker compose exec backend-test rm -rf /app/var/cache/test/

      - name: Run integration and unit tests
        run: docker compose exec backend-test vendor/bin/phpunit --testdox --testsuite integration,unit
