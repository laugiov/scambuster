name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: scambuster_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend-symfony

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, redis, intl, mailparse
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend-symfony/vendor
          key: composer-${{ hashFiles('backend-symfony/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse src --no-progress

  code-style:
    name: Code Style (PHP-CS-Fixer)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-symfony

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend-symfony/vendor
          key: composer-${{ hashFiles('backend-symfony/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHP-CS-Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no

  tests:
    name: Tests (PHPUnit)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: scambuster_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend-symfony

    env:
      APP_ENV: test
      DATABASE_URL: "postgresql://postgres:ci_password@localhost:5432/scambuster_test"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "ci-test-jwt-secret-not-for-production"
      APP_SECRET: "ci-test-app-secret"
      VAULT_ADDR: "http://localhost:8200"
      VAULT_TOKEN: "ci-test-token"
      LOGIN_HASH_SALT: "ci-test-salt"
      LLM_API_KEY: "sk-test-not-a-real-key"
      LLM_PROVIDER: "openai"
      LLM_MODEL: "gpt-4o-mini"
      LLM_API_URL: "https://api.openai.com/v1"
      SCAMBUSTER_KILL_SWITCH: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, redis, intl, mailparse
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend-symfony/vendor
          key: composer-${{ hashFiles('backend-symfony/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run database migrations
        run: |
          php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Load test fixtures
        run: |
          php bin/console doctrine:fixtures:load --env=test --no-interaction

      - name: Run unit and integration tests
        run: vendor/bin/phpunit --testdox --testsuite integration,unit
