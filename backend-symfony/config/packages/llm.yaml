parameters:
    # LLM Provider configuration
    llm.provider: '%env(LLM_PROVIDER)%'
    llm.model: '%env(LLM_MODEL)%'
    # Stronger model for the heavy-reasoning services (quality auditor,
    # conversation analyzer). Defaults to gpt-4o so an OpenAI install keeps its
    # historical quality with no extra config; a local provider sets
    # LLM_MODEL_STRONG to its own strong model.
    llm.model_strong.default: 'gpt-4o'
    llm.model_strong: '%env(default:llm.model_strong.default:LLM_MODEL_STRONG)%'
    llm.api_url: '%env(LLM_API_URL)%'
    llm.api_key: '%env(LLM_API_KEY)%'
    ollama.default_url: 'http://localhost:11434'
    anthropic.default_key: ''
    # Embeddings. Default to the OpenAI model/dimension so a default install is
    # unchanged; a local provider sets LLM_EMBEDDING_MODEL to its own model
    # (dimension is then taken from the returned vector, not this hint).
    llm.embedding_model.default: 'text-embedding-3-small'
    llm.embedding_model: '%env(default:llm.embedding_model.default:LLM_EMBEDDING_MODEL)%'
    llm.embedding_dimensions.default: 1536
    llm.embedding_dimensions: '%env(default:llm.embedding_dimensions.default:int:LLM_EMBEDDING_DIMENSIONS)%'
    # Env-overridable monthly LLM budget cap (USD).
    # Default 50 USD. Operators raise via LLM_MAX_COST_USD_MONTH env var.
    llm.max_cost_usd_month: '%env(default:llm_default_max_cost:float:LLM_MAX_COST_USD_MONTH)%'
    llm_default_max_cost: 50.0
    # Budget enforcement mode: 'warning' or 'enforce'.
    # 'warning' = log a warning when budget exceeded, allow the call (telemetry validation window)
    # 'enforce' = throw LlmBudgetExceededException → HTTP 503
    llm.budget_enforcement_mode: '%env(default:llm_default_enforcement_mode:LLM_BUDGET_ENFORCEMENT_MODE)%'
    llm_default_enforcement_mode: 'warning'

    # Validation settings
    llm.validation_enabled: '%env(bool:LLM_VALIDATION_ENABLED)%'
    reply.min_words: '%env(int:REPLY_MIN_WORDS)%'
    reply.max_words: '%env(int:REPLY_MAX_WORDS)%'
    reply.max_links: '%env(int:REPLY_MAX_LINKS)%'

    # Reply-pipeline feature flags (validator coherence + signature strip).
    # Each flag toggles one of the four coordinated changes independently so that
    # rollback can be granular without redeploy.
    reply.signature_strip.enabled:            '%env(bool:REPLY_SIGNATURE_STRIP_ENABLED)%'
    reply.validator.context.enabled:          '%env(bool:REPLY_VALIDATOR_CONTEXT_ENABLED)%'
    reply.validator.structured_correction:    '%env(bool:REPLY_VALIDATOR_STRUCTURED_CORRECTION)%'
    reply.generator.patch_mode:               '%env(bool:REPLY_GENERATOR_PATCH_MODE)%'
    reply.generator.no_signature_instruction: '%env(bool:REPLY_GENERATOR_NO_SIGNATURE_INSTRUCTION)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Infrastructure - LLM Providers
    App\Infrastructure\LLM\Provider\OpenAIClient:
        arguments:
            $httpClient: '@http_client'
            $logger: '@monolog.logger.llm'
            $eventDispatcher: '@event_dispatcher'
            $apiUrl: '%llm.api_url%'
            $apiKey: '%llm.api_key%'
            $model: '%llm.model%'

    # Infrastructure - Anthropic provider
    App\Infrastructure\LLM\Provider\AnthropicClient:
        arguments:
            $httpClient: '@http_client'
            $logger: '@monolog.logger.llm'
            $eventDispatcher: '@event_dispatcher'
            $apiKey: '%env(default:anthropic.default_key:ANTHROPIC_API_KEY)%'
            $model: '%llm.model%'

    # Infrastructure - Ollama provider (local)
    App\Infrastructure\LLM\Provider\OllamaClient:
        arguments:
            $httpClient: '@http_client'
            $logger: '@monolog.logger.llm'
            $eventDispatcher: '@event_dispatcher'
            $baseUrl: '%env(default:ollama.default_url:OLLAMA_BASE_URL)%'
            $model: '%llm.model%'

    # Infrastructure - Mock provider (demo mode, no external API)
    App\Infrastructure\LLM\Provider\MockLLMClient: ~

    # Infrastructure - Embedding providers (swapped by LLMProviderCompilerPass)
    App\Infrastructure\LLM\Provider\OpenAIEmbeddingClient:
        arguments:
            $httpClient: '@http_client'
            $apiKey: '%llm.api_key%'
            $apiUrl: '%llm.api_url%'
            $model: '%llm.embedding_model%'
            $dimensions: '%llm.embedding_dimensions%'
            $logger: '@monolog.logger.llm'
    App\Infrastructure\LLM\Provider\OllamaEmbeddingClient:
        arguments:
            $httpClient: '@http_client'
            $baseUrl: '%env(default:ollama.default_url:OLLAMA_BASE_URL)%'
            $model: '%llm.embedding_model%'
            $logger: '@monolog.logger.llm'
    App\Infrastructure\LLM\Provider\MockEmbeddingClient: ~

    # Default embedding binding: OpenAI. LLMProviderCompilerPass swaps this alias.
    App\Application\LLM\Port\EmbeddingClientInterface: '@App\Infrastructure\LLM\Provider\OpenAIEmbeddingClient'

    # Application - LLM Cost monitoring
    App\Application\LLM\CostEstimator: ~

    # Application - Embedding Service (provider-agnostic via EmbeddingClientInterface)
    App\Application\LLM\EmbeddingService:
        arguments:
            $client: '@App\Application\LLM\Port\EmbeddingClientInterface'
            $logger: '@monolog.logger.llm'
            $dimensions: '%llm.embedding_dimensions%'

    App\Application\Monitoring\LlmCostHandler:
        arguments:
            $connection: '@doctrine.dbal.default_connection'
            $monthlyLimitUsd: '%llm.max_cost_usd_month%'

    App\Infrastructure\EventListener\LlmUsageListener:
        arguments:
            $logger: '@monolog.logger.llm'

    # Default binding: OpenAI
    # LLMProviderCompilerPass swaps this alias at container build time
    # based on LLM_PROVIDER env var (openai|anthropic|ollama|mock)
    App\Application\LLM\Port\LLMClientInterface: '@App\Infrastructure\LLM\Provider\OpenAIClient'

    # Application - ContextAnalyzer (analyses conversation state slots)
    App\Application\LLM\ContextAnalyzer: ~

    # Application - IOCLikelihoodScorer (scores IOC extraction likelihood)
    App\Application\LLM\IOCLikelihoodScorer: ~

    # Application - VariationProvider (prevents repetitive patterns - basic fallback)
    App\Application\LLM\VariationProvider: ~

    # Application - ConversationAnalyzer (intelligent LLM-based anti-repetition analysis)
    App\Application\LLM\ConversationAnalyzer:
        arguments:
            $llmClient: '@App\Application\LLM\Port\LLMClientInterface'
            $logger: '@monolog.logger.llm'
            $prompts: '@App\Application\LLM\Prompt\PromptProvider'
            $model: '%llm.model_strong%'

    # Application - ReciprocityManager (manages give/take balance)
    App\Application\LLM\ReciprocityManager: ~

    # Application - LanguageDetector (trigram-based language detection)
    App\Application\LLM\LanguageDetector: ~

    # Application - FallbackProvider (multilingual fallback messages)
    App\Application\LLM\FallbackProvider: ~

    # Application - PromptBuilder
    App\Application\LLM\PromptBuilder:
        arguments:
            $contextAnalyzer: '@App\Application\LLM\ContextAnalyzer'
            $variationProvider: '@App\Application\LLM\VariationProvider'
            $reciprocityManager: '@App\Application\LLM\ReciprocityManager'
            $personaManager: '@App\Application\Communication\PersonaManager'
            $logger: '@monolog.logger.llm'
            $conversationAnalyzer: '@App\Application\LLM\ConversationAnalyzer'
            $prompts: '@App\Application\LLM\Prompt\PromptProvider'

    # Application - PolicyGuard (word count thresholds are now dynamic via PolicyGuardConfig)
    App\Application\LLM\PolicyGuard:
        arguments:
            $logger: '@monolog.logger.llm'
            $maxLinks: '%reply.max_links%'

    # Application - ReplyValidator
    App\Application\LLM\ReplyValidator:
        arguments:
            $llmClient: '@App\Application\LLM\Port\LLMClientInterface'
            $promptBuilder: '@App\Application\LLM\PromptBuilder'
            $logger: '@monolog.logger.llm'

    # Application - OperationalLeakageDetector (second LLM judge)
    App\Application\LLM\OperationalLeakageDetector:
        arguments:
            $llmClient: '@App\Application\LLM\Port\LLMClientInterface'
            $logger: '@monolog.logger.llm'
            $model: '%llm.model%'

    # Payment-instigation guard (LLM judge that blocks persona
    # outbounds introducing SWIFT/IBAN/wire/bank topics before operator).
    # MUST be registered explicitly because Application/LLM/ is excluded
    # from autowire (see config/services.yaml).
    App\Application\LLM\PaymentInstigationGuard:
        arguments:
            $em: '@doctrine.orm.entity_manager'
            $llmClient: '@App\Application\LLM\Port\LLMClientInterface'
            $logger: '@monolog.logger.llm'
            $model: '%llm.model%'

    # Application - ReplyOrchestrator
    App\Application\LLM\ReplyOrchestrator:
        arguments:
            $llmClient: '@App\Application\LLM\Port\LLMClientInterface'
            $promptBuilder: '@App\Application\LLM\PromptBuilder'
            $policyGuard: '@App\Application\LLM\PolicyGuard'
            $replyValidator: '@App\Application\LLM\ReplyValidator'
            $iocScorer: '@App\Application\LLM\IOCLikelihoodScorer'
            $logger: '@monolog.logger.llm'
            $iocThreshold: 60
            # Wire the leak detector + audit logger
            $leakDetector: '@App\Application\LLM\OperationalLeakageDetector'
            $auditLogger: '@App\Application\Audit\AuditLogger'
            $model: '%llm.model%'
            # Payment-instigation guard (stage 2b in RetryCoordinator)
            $paymentInstigationGuard: '@App\Application\LLM\PaymentInstigationGuard'

    # Application - JsonValidator (validates LLM JSON responses)
    App\Application\LLM\JsonValidator:
        autowire: true
        autoconfigure: true

    # Application - ScamClassifier (classifies scams with LLM)
    App\Application\LLM\ScamClassifier:
        arguments:
            $llmClient: '@App\Application\LLM\Port\LLMClientInterface'
            $scamTypeManager: '@App\Application\Communication\ScamTypeManager'
            $jsonValidator: '@App\Application\LLM\JsonValidator'
            $logger: '@monolog.logger.llm'

    # Application - IocExtractor (extracts IOCs from messages with LLM)
    App\Application\Communication\IocExtractor:
        arguments:
            $llmClient: '@App\Application\LLM\Port\LLMClientInterface'
            $logger: '@monolog.logger.llm'

    # Application - EphemeralPromptOverride (process-local candidate holder for GUARD "validate
    # this prompt"). Explicit because src/Application/LLM/ is excluded from autowire. Shared
    # (stateful) service: empty in every normal process, set only inside the canary worker.
    App\Application\LLM\Prompt\EphemeralPromptOverride: ~

    # Infrastructure - CompositePromptOverrideSource: the override chain head consumed by
    # PromptProvider — the ephemeral candidate holder ahead of the DB source (first non-null wins).
    App\Infrastructure\Prompt\CompositePromptOverrideSource:
        arguments:
            $sources:
                - '@App\Application\LLM\Prompt\EphemeralPromptOverride'
                - '@App\Infrastructure\Prompt\CachedDbPromptOverrideSource'

    # Application - PromptProvider (operator prompt-override resolution spine)
    # Wired explicitly because src/Application/LLM/ is excluded from autowire.
    App\Application\LLM\Prompt\PromptProvider:
        arguments:
            $promptDir: '%kernel.project_dir%/config/scambuster/prompts'
            $logger: '@monolog.logger.llm'
            $overrideSource: '@App\Infrastructure\Prompt\CompositePromptOverrideSource'

    # Application - ContextualEnricher (LLM semantic enrichment for IOC context)
    App\Application\LLM\ContextualEnricher:
        arguments:
            $llmClient: '@App\Application\LLM\Port\LLMClientInterface'
            $anonymizer: '@App\Application\Communication\MessageAnonymizer'
            $dispatcher: '@event_dispatcher'
            $logger: '@monolog.logger.llm'
            $promptProvider: '@App\Application\LLM\Prompt\PromptProvider'
            $provider: '%llm.provider%'
            $model: '%llm.model%'

    App\Application\LLM\ContextualEnrichmentRequest: ~
    App\Application\LLM\ContextualEnrichmentResult: ~

    # Application - TtpExtractor (tags scammer TTPs in inbound messages with LLM)
    # Wired explicitly because src/Application/LLM/ is excluded from autowire.
    App\Application\LLM\TtpExtractor:
        arguments:
            $llmClient: '@App\Application\LLM\Port\LLMClientInterface'
            $logger: '@monolog.logger.llm'
            $promptProvider: '@App\Application\LLM\Prompt\PromptProvider'

    # SignatureStripper: deterministic regex-only signature
    # stripper. The bool flag is wired explicitly here because the
    # services.yaml _defaults.bind is not in scope for services defined
    # in this packages/ file.
    App\Application\LLM\SignatureStripper:
        arguments:
            $signatureStripEnabled: '%reply.signature_strip.enabled%'
            $logger: '@monolog.logger.llm'

    # Application - Prompt Injection Detection (forensic analysis of inbound messages)
    App\Application\Communication\PromptInjectionPatternMatcher:
        arguments:
            $logger: '@monolog.logger.llm'

    App\Application\Communication\PromptInjectionLlmAnalyzer:
        arguments:
            $llmClient: '@App\Application\LLM\Port\LLMClientInterface'
            $logger: '@monolog.logger.llm'
            $model: '%env(PROMPT_INJECTION_MODEL)%'
            $temperature: '%env(float:PROMPT_INJECTION_TEMPERATURE)%'

    App\Application\Communication\PromptInjectionDetector:
        arguments:
            $patternMatcher: '@App\Application\Communication\PromptInjectionPatternMatcher'
            $llmAnalyzer: '@App\Application\Communication\PromptInjectionLlmAnalyzer'
            $logger: '@monolog.logger.llm'
            $enabled: '%env(bool:PROMPT_INJECTION_ENABLED)%'

monolog:
    channels: ['llm']
