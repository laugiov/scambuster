# config/packages/rate_limiter.yaml
parameters:
    # Enforcement mode for the LLM pipeline ceilings below: 'warning' or 'enforce'.
    # 'warning' = record the breach (log + audit event) and allow the reply — the
    #             measurement window that shows how much traffic would be refused
    # 'enforce' = refuse the reply
    # Anything unrecognised resolves to 'warning': enforcement is the mode that turns
    # traffic away, so it must never be reached by a typo or an unset variable.
    # Mirrors llm.budget_enforcement_mode, which governs the cost cap the same way.
    scambuster.rate_limit_enforcement_mode: '%env(default:scambuster_default_rate_limit_mode:SCAMBUSTER_RATE_LIMIT_ENFORCEMENT_MODE)%'
    scambuster_default_rate_limit_mode: 'warning'

framework:
  rate_limiter:
    # -----------------------------------------------------------
    # HTTP rate limiters
    # -----------------------------------------------------------
    login_ip:
      policy: 'sliding_window'
      limit: 5
      interval: '1 minute'

    # Per-email brute-force protection.
    # Complements login_ip: a distributed attacker rotating IPs but
    # targeting the same email is throttled at the email level.
    login_email:
      policy: 'sliding_window'
      limit: 5
      interval: '15 minutes'

    api_global:
      policy: 'token_bucket'
      limit: 100
      rate: { interval: '1 minute', amount: 100 }

    # -----------------------------------------------------------
    # LLM pipeline rate limits (Redis-backed via cache.app)
    # -----------------------------------------------------------
    replies_per_conversation:
      policy: 'sliding_window'
      limit: 20
      interval: '24 hours'

    llm_calls_per_hour:
      policy: 'sliding_window'
      limit: 200
      interval: '1 hour'

    active_conversations_per_day:
      policy: 'sliding_window'
      limit: 50
      interval: '24 hours'

    # -----------------------------------------------------------
    # Per-sender rate limits (applied at ingest)
    # -----------------------------------------------------------
    emails_per_sender_per_day:
      policy: 'sliding_window'
      limit: 10
      interval: '24 hours'

    # -----------------------------------------------------------
    # Per-account ingest rate limit
    # -----------------------------------------------------------
    # Throttles POST /api/v1/communication/ingest/raw per account_id.
    # Protects against a flood targeting one specific honeypot account
    # exhausting the LLM pipeline for healthy accounts.
    ingest_per_account:
      policy: 'sliding_window'
      limit: 100
      interval: '1 hour'
