security:
    providers:
        test_users:
            memory:
                users:
                    test-user:
                        password: foo
                        roles: ['ROLE_USER']
                    test-admin:
                        password: foo
                        roles: ['ROLE_ADMIN', 'ROLE_USER']
    firewalls:
        api:
            pattern: ^/api/v1
            stateless: true
            provider: test_users
            jwt: false
            custom_authenticators:
                - App\Security\TestTokenAuthenticator
        main:
            pattern: ^/
            stateless: true
            provider: test_users
            custom_authenticators:
                - App\Security\TestTokenAuthenticator
