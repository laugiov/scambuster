# Shipped defaults for operator-tunable scalars.
#
# DO NOT edit this file to customize your deployment — copy the key you want to
# change into config/scambuster/scambuster.yaml (which overrides these and is the
# operator-owned file). This file documents the canonical defaults.
parameters:
    # Weight of the LLM outcome score in the RewardJudge blend (0.0..1.0); the
    # remainder is the mechanical metric reward. Higher = trust the LLM's judgement
    # of "a good outcome" more; lower = lean on the mechanical duration/IOC metrics.
    scambuster.reward.llm_weight: 0.7
