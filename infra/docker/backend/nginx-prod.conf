# Production nginx site: serves the built React SPA and proxies the Symfony API
# to php-fpm (same container, loopback). One origin, one port.
server {
    listen 8080;
    server_name _;

    # Built React frontend (from the image's frontend build stage)
    root /app/public-frontend;
    index index.html;

    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;
    gzip_min_length 256;

    # --- Symfony API + operational endpoints → php-fpm front controller ---
    # Everything the backend owns lives under these prefixes; the rest is the SPA.
    location ^~ /api/     { try_files $uri /index.php$is_args$args; }
    location = /healthz   { try_files $uri /index.php$is_args$args; }
    location ^~ /logout   { try_files $uri /index.php$is_args$args; }

    # Only the Symfony front controller is executable (Symfony best practice)
    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /app/public;
        fastcgi_read_timeout 60s;
        internal;
    }

    # Static frontend assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React SPA fallback (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
